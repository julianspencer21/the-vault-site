<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Vault – Fitness & Nutrition Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #00ff88;
      --green-dim: #00cc77;
      --green-glow: rgba(0,255,136,0.25);
      --blue: #3399ff;
      --orange: #ff9900;
      --red: #ff4444;
      --bg: #0d0d0d;
      --bg2: #141414;
      --bg3: #1a1a1a;
      --bg4: #222;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --text-dim: #888;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }

    /* ── TOP NAV ── */
    .top-nav {
      background: #0a0a0a;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-nav .logo {
      color: var(--green);
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 0;
      margin-right: 12px;
      white-space: nowrap;
      text-shadow: 0 0 8px var(--green);
    }
    .nav-tab {
      background: none;
      border: none;
      color: var(--text-dim);
      padding: 16px 18px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      border-bottom: 3px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active { color: var(--green); border-bottom-color: var(--green); }

    /* ── PANELS ── */
    .panel { display: none; padding: 28px 20px; max-width: 1100px; margin: 0 auto; }
    .panel.active { display: block; }

    /* ── CARDS ── */
    .card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── GRID LAYOUTS ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
    @media(max-width:800px) {
      .grid-2,.grid-3,.grid-4 { grid-template-columns: 1fr; }
    }
    @media(max-width:600px) {
      .top-nav { flex-wrap: wrap; padding: 0 12px; }
      .nav-tab { padding: 12px 10px; font-size: 0.8rem; }
    }

    /* ── STAT BOXES ── */
    .stat-box {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .stat-box .stat-val {
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--green);
    }
    .stat-box .stat-lbl {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── FORM ELEMENTS ── */
    label { font-size: 0.82rem; color: var(--text-dim); display: block; margin-bottom: 4px; }
    input, select, textarea {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      padding: 9px 12px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--green-dim); }
    textarea { resize: vertical; min-height: 70px; }
    .form-row { display: grid; gap: 12px; margin-bottom: 14px; }
    .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
    .form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    .form-row.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
    @media(max-width:600px) {
      .form-row.cols-2,.form-row.cols-3,.form-row.cols-4 { grid-template-columns: 1fr; }
    }

    /* ── BUTTONS ── */
    .btn {
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 7px;
      padding: 10px 18px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.1s;
    }
    .btn:hover { box-shadow: 0 0 12px var(--green-glow); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .btn-outline {
      background: none;
      border: 1px solid var(--green-dim);
      color: var(--green);
    }
    .btn-outline:hover { background: var(--green-glow); }
    .btn-red { background: var(--red); color: #fff; }
    .btn-red:hover { box-shadow: 0 0 10px rgba(255,68,68,0.4); }
    .btn-blue { background: var(--blue); color: #fff; }
    .btn-orange { background: var(--orange); color: #000; }

    /* ── TABLES ── */
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th {
      text-align: left;
      color: var(--text-dim);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 10px 10px; border-bottom: 1px solid #1f1f1f; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg4); }

    /* ── PROGRESS BAR ── */
    .progress-wrap { background: var(--bg2); border-radius: 99px; height: 10px; overflow: hidden; }
    .progress-bar {
      height: 100%;
      border-radius: 99px;
      background: var(--green);
      transition: width 0.4s ease;
      box-shadow: 0 0 8px var(--green-glow);
    }
    .progress-bar.warn { background: var(--orange); box-shadow: 0 0 8px rgba(255,153,0,0.4); }
    .progress-bar.over { background: var(--red); box-shadow: 0 0 8px rgba(255,68,68,0.4); }

    /* ── BADGE ── */
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 99px;
      font-size: 0.73rem;
      font-weight: 700;
    }
    .badge-green { background: rgba(0,255,136,0.15); color: var(--green); }
    .badge-orange { background: rgba(255,153,0,0.15); color: var(--orange); }
    .badge-red { background: rgba(255,68,68,0.15); color: var(--red); }
    .badge-blue { background: rgba(51,153,255,0.15); color: var(--blue); }

    /* ── SECTION HEADER ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .section-header h2 {
      font-size: 1.3rem;
      color: var(--green);
      text-shadow: 0 0 8px var(--green-glow);
    }

    /* ── MACRO PILL ROW ── */
    .macro-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
    .macro-pill {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      text-align: center;
      min-width: 80px;
    }
    .macro-pill .macro-val { font-size: 1.2rem; font-weight: 700; }
    .macro-pill .macro-lbl { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }
    .macro-pill.protein .macro-val { color: #ff6b6b; }
    .macro-pill.carbs .macro-val { color: var(--blue); }
    .macro-pill.fat .macro-val { color: var(--orange); }
    .macro-pill.cal .macro-val { color: var(--green); }

    /* ── DATE SELECTOR ── */
    .date-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .date-nav button {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 1rem;
    }
    .date-nav button:hover { border-color: var(--green-dim); }
    .date-nav .date-display {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* ── CLIENT CARD ── */
    .client-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .client-card:hover { border-color: var(--green-dim); box-shadow: 0 0 15px var(--green-glow); }
    .client-card.selected { border-color: var(--green); box-shadow: 0 0 15px var(--green-glow); }
    .client-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
    .client-meta { font-size: 0.82rem; color: var(--text-dim); }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 20px;
    }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--bg3);
      border: 1px solid var(--green-dim);
      color: var(--green);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 999;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ── CHART CANVAS ── */
    .chart-wrap { position: relative; height: 180px; }
    canvas.sparkline { width: 100%; height: 100%; }

    /* ── EMPTY STATE ── */
    .empty { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 0.9rem; }
    .empty svg { opacity: 0.25; margin-bottom: 12px; }

    /* ── COLLAPSIBLE ── */
    .collapsible-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .collapsible-body { overflow: hidden; transition: max-height 0.3s ease; }

    /* ── WORKOUT LOG ITEM ── */
    .exercise-row {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .exercise-row .ex-name { flex: 1; font-weight: 600; }
    .exercise-row .ex-detail { font-size: 0.8rem; color: var(--text-dim); }

    /* ── PROGRESS NOTE ── */
    .progress-note {
      background: var(--bg2);
      border-left: 3px solid var(--green-dim);
      border-radius: 0 8px 8px 0;
      padding: 10px 14px;
      margin-bottom: 8px;
    }
    .progress-note .note-date { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; }
    .progress-note .note-text { font-size: 0.88rem; }

    /* ── WEIGHT TREND ── */
    .trend-up { color: var(--orange); }
    .trend-down { color: var(--green); }
    .trend-flat { color: var(--text-dim); }
  </style>
</head>
<body>

<!-- TOP NAV -->
<nav class="top-nav">
  <div class="logo">⚡ The Vault Tracker</div>
  <button class="nav-tab active" onclick="showPanel('dashboard')">Dashboard</button>
  <button class="nav-tab" onclick="showPanel('nutrition')">Nutrition</button>
  <button class="nav-tab" onclick="showPanel('workouts')">Workouts</button>
  <button class="nav-tab" onclick="showPanel('clients')">Clients</button>
</nav>

<!-- ═══════════════════════════════════════════ DASHBOARD ═══════ -->
<div id="panel-dashboard" class="panel active">
  <div class="section-header">
    <h2>Dashboard</h2>
    <span id="dash-today" style="color:var(--text-dim);font-size:0.85rem;"></span>
  </div>

  <!-- Quick stats row -->
  <div class="grid-4" style="margin-bottom:20px;" id="dash-stats"></div>

  <div class="grid-2">
    <!-- Today's Nutrition -->
    <div class="card">
      <div class="card-title">🍎 Today's Nutrition</div>
      <div id="dash-nutrition"></div>
    </div>
    <!-- Today's Workout -->
    <div class="card">
      <div class="card-title">💪 Today's Workout</div>
      <div id="dash-workout"></div>
    </div>
  </div>

  <!-- Client overview -->
  <div class="card">
    <div class="card-title">👥 Client Snapshot</div>
    <div id="dash-clients"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════ NUTRITION ════════ -->
<div id="panel-nutrition" class="panel">
  <div class="section-header">
    <h2>Nutrition Tracker</h2>
    <div style="display:flex;gap:10px;align-items:center;">
      <select id="nutrition-client-select" style="width:160px;"></select>
      <button class="btn btn-sm" onclick="openAddFoodModal()">+ Log Food</button>
    </div>
  </div>

  <!-- Date nav -->
  <div class="date-nav">
    <button onclick="shiftDate('nutrition',-1)">◀</button>
    <span class="date-display" id="nutrition-date-display"></span>
    <button onclick="shiftDate('nutrition',1)">▶</button>
    <button class="btn btn-sm btn-outline" onclick="jumpToToday('nutrition')">Today</button>
  </div>

  <!-- Calorie goal progress -->
  <div class="card" id="nutrition-summary"></div>

  <!-- Meal log table -->
  <div class="card">
    <div class="card-title">Food Log</div>
    <div id="food-log-body"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════ WORKOUTS ═════════ -->
<div id="panel-workouts" class="panel">
  <div class="section-header">
    <h2>Workout Tracker</h2>
    <div style="display:flex;gap:10px;align-items:center;">
      <select id="workout-client-select" style="width:160px;"></select>
      <button class="btn btn-sm" onclick="openAddWorkoutModal()">+ Log Workout</button>
    </div>
  </div>

  <!-- Date nav -->
  <div class="date-nav">
    <button onclick="shiftDate('workout',-1)">◀</button>
    <span class="date-display" id="workout-date-display"></span>
    <button onclick="shiftDate('workout',1)">▶</button>
    <button class="btn btn-sm btn-outline" onclick="jumpToToday('workout')">Today</button>
  </div>

  <div id="workout-log-body"></div>

  <!-- PR Board -->
  <div class="card" style="margin-top:20px;">
    <div class="card-title">🏆 Personal Records</div>
    <div id="pr-board"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════ CLIENTS ══════════ -->
<div id="panel-clients" class="panel">
  <div class="section-header">
    <h2>Client List</h2>
    <button class="btn btn-sm" onclick="openClientModal()">+ Add Client</button>
  </div>

  <div class="grid-3" id="client-grid"></div>

  <!-- Selected client detail -->
  <div id="client-detail" style="display:none; margin-top:24px;"></div>
</div>

<!-- ═══════════════════ MODALS ═════════════════════════════════════ -->

<!-- Add Food Modal -->
<div class="modal-overlay" id="modal-food">
  <div class="modal">
    <div class="modal-title">Log Food Entry</div>
    <div class="form-row cols-2">
      <div><label>Food Name</label><input id="food-name" placeholder="e.g. Chicken Breast" /></div>
      <div><label>Meal</label>
        <select id="food-meal">
          <option>Breakfast</option><option>Lunch</option>
          <option>Dinner</option><option>Snack</option>
        </select>
      </div>
    </div>
    <div class="form-row cols-4">
      <div><label>Calories</label><input id="food-cal" type="number" placeholder="0" /></div>
      <div><label>Protein (g)</label><input id="food-protein" type="number" placeholder="0" /></div>
      <div><label>Carbs (g)</label><input id="food-carbs" type="number" placeholder="0" /></div>
      <div><label>Fat (g)</label><input id="food-fat" type="number" placeholder="0" /></div>
    </div>
    <div class="form-row">
      <div><label>Serving / Notes</label><input id="food-serving" placeholder="e.g. 6oz" /></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('modal-food')">Cancel</button>
      <button class="btn btn-sm" onclick="saveFood()">Save</button>
    </div>
  </div>
</div>

<!-- Add Workout Modal -->
<div class="modal-overlay" id="modal-workout">
  <div class="modal">
    <div class="modal-title">Log Workout</div>
    <div class="form-row cols-2">
      <div><label>Workout Name</label><input id="wo-name" placeholder="e.g. Upper Body Push" /></div>
      <div><label>Type</label>
        <select id="wo-type">
          <option>Strength</option><option>Cardio</option>
          <option>HIIT</option><option>Flexibility</option><option>Sports</option>
        </select>
      </div>
    </div>
    <div class="form-row cols-2">
      <div><label>Duration (min)</label><input id="wo-duration" type="number" placeholder="45" /></div>
      <div><label>Calories Burned (est.)</label><input id="wo-calories" type="number" placeholder="0" /></div>
    </div>
    <div style="margin-bottom:14px;">
      <div class="card-title" style="margin-bottom:10px;">Exercises</div>
      <div id="exercise-list"></div>
      <button class="btn btn-outline btn-sm" onclick="addExerciseRow()">+ Add Exercise</button>
    </div>
    <div class="form-row">
      <div><label>Notes</label><textarea id="wo-notes" placeholder="How did it feel?"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('modal-workout')">Cancel</button>
      <button class="btn btn-sm" onclick="saveWorkout()">Save</button>
    </div>
  </div>
</div>

<!-- Client Modal -->
<div class="modal-overlay" id="modal-client">
  <div class="modal">
    <div class="modal-title" id="client-modal-title">Add Client</div>
    <div class="form-row cols-2">
      <div><label>Name</label><input id="cl-name" placeholder="Full name" /></div>
      <div><label>Relationship</label>
        <select id="cl-relationship">
          <option>Client</option><option>Girlfriend</option>
          <option>Friend</option><option>Self</option><option>Other</option>
        </select>
      </div>
    </div>
    <div class="form-row cols-3">
      <div><label>Age</label><input id="cl-age" type="number" placeholder="25" /></div>
      <div><label>Height</label><input id="cl-height" placeholder='5\'6"' /></div>
      <div><label>Starting Weight (lbs)</label><input id="cl-start-weight" type="number" placeholder="150" /></div>
    </div>
    <div class="form-row cols-2">
      <div><label>Current Weight (lbs)</label><input id="cl-weight" type="number" placeholder="150" /></div>
      <div><label>Goal Weight (lbs)</label><input id="cl-goal-weight" type="number" placeholder="130" /></div>
    </div>
    <div class="form-row cols-2">
      <div><label>Daily Calorie Goal</label><input id="cl-cal-goal" type="number" placeholder="1800" /></div>
      <div><label>Protein Goal (g)</label><input id="cl-protein-goal" type="number" placeholder="140" /></div>
    </div>
    <div class="form-row">
      <div><label>Primary Goal</label>
        <select id="cl-goal">
          <option>Weight Loss</option><option>Muscle Gain</option>
          <option>Maintenance</option><option>Recomposition</option>
          <option>Improve Endurance</option><option>General Health</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div><label>Notes / Background</label>
        <textarea id="cl-notes" placeholder="Dietary restrictions, injuries, preferences..."></textarea>
      </div>
    </div>
    <input type="hidden" id="cl-edit-id" />
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('modal-client')">Cancel</button>
      <button class="btn btn-sm" onclick="saveClient()">Save Client</button>
    </div>
  </div>
</div>

<!-- Progress Note Modal -->
<div class="modal-overlay" id="modal-progress">
  <div class="modal">
    <div class="modal-title">Add Progress Update</div>
    <div class="form-row cols-2">
      <div><label>Current Weight (lbs)</label><input id="prog-weight" type="number" /></div>
      <div><label>Date</label><input id="prog-date" type="date" /></div>
    </div>
    <div class="form-row">
      <div><label>Progress Note</label>
        <textarea id="prog-note" placeholder="Measurements, energy levels, mood, milestones..."></textarea>
      </div>
    </div>
    <input type="hidden" id="prog-client-id" />
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('modal-progress')">Cancel</button>
      <button class="btn btn-sm" onclick="saveProgress()">Save Update</button>
    </div>
  </div>
</div>

<!-- Edit Weight Modal -->
<div class="modal-overlay" id="modal-weight">
  <div class="modal">
    <div class="modal-title">Update Current Weight</div>
    <div class="form-row">
      <div><label>New Weight (lbs)</label><input id="new-weight" type="number" /></div>
    </div>
    <input type="hidden" id="weight-client-id" />
    <div class="modal-footer">
      <button class="btn btn-outline btn-sm" onclick="closeModal('modal-weight')">Cancel</button>
      <button class="btn btn-sm" onclick="saveWeight()">Update</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ═══════════════════════════ DATA LAYER ═══════════════════════════

function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch { return def; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

const DB = {
  get clients() { return load('vt_clients', []); },
  set clients(v) { save('vt_clients', v); },
  get foods() { return load('vt_foods', []); },
  set foods(v) { save('vt_foods', v); },
  get workouts() { return load('vt_workouts', []); },
  set workouts(v) { save('vt_workouts', v); },
  get progress() { return load('vt_progress', []); },
  set progress(v) { save('vt_progress', v); },
};

// Seed default client if empty
function ensureDefaultClient() {
  if (DB.clients.length === 0) {
    DB.clients = [{
      id: uid(),
      name: 'Your Girlfriend',
      relationship: 'Girlfriend',
      age: '',
      height: '',
      startWeight: '',
      weight: '',
      goalWeight: '',
      calGoal: 1800,
      proteinGoal: 140,
      goal: 'Weight Loss',
      notes: '',
      createdAt: today()
    }];
  }
}

// ═══════════════════════════ UTILS ════════════════════════════════

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function today() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) {
  const [y,m,day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[+m-1]} ${+day}, ${y}`;
}
function dateLabel(d) {
  if (d === today()) return 'Today';
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  if (d === yesterday.toISOString().slice(0,10)) return 'Yesterday';
  return fmtDate(d);
}
function shiftDateStr(d, days) {
  const dt = new Date(d + 'T00:00:00');
  dt.setDate(dt.getDate() + days);
  return dt.toISOString().slice(0,10);
}

const state = {
  nutritionDate: today(),
  workoutDate: today(),
  activeClientId: null,
  selectedClientId: null,
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ═══════════════════════════ NAV ══════════════════════════════════

function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  event.target.classList.add('active');
  renderPanel(name);
}

function renderPanel(name) {
  if (name==='dashboard') renderDashboard();
  if (name==='nutrition') renderNutrition();
  if (name==='workouts') renderWorkouts();
  if (name==='clients') renderClients();
}

// ═══════════════════════════ MODALS ═══════════════════════════════

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target===m) m.classList.remove('open'); });
});

// ═══════════════════════════ DATE NAV ═════════════════════════════

function shiftDate(type, dir) {
  if (type==='nutrition') {
    state.nutritionDate = shiftDateStr(state.nutritionDate, dir);
    renderNutrition();
  } else {
    state.workoutDate = shiftDateStr(state.workoutDate, dir);
    renderWorkouts();
  }
}
function jumpToToday(type) {
  if (type==='nutrition') { state.nutritionDate = today(); renderNutrition(); }
  else { state.workoutDate = today(); renderWorkouts(); }
}

// ═══════════════════════════ CLIENT SELECTS ═══════════════════════

function populateClientSelects() {
  const clients = DB.clients;
  ['nutrition-client-select','workout-client-select'].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    const cur = sel.value;
    sel.innerHTML = clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    if (cur && clients.find(c=>c.id===cur)) sel.value = cur;
    else if (clients.length) sel.value = clients[0].id;
  });
}

function getActiveNutritionClient() {
  const sel = document.getElementById('nutrition-client-select');
  return sel ? sel.value : (DB.clients[0]?.id || null);
}
function getActiveWorkoutClient() {
  const sel = document.getElementById('workout-client-select');
  return sel ? sel.value : (DB.clients[0]?.id || null);
}

// ═══════════════════════════ DASHBOARD ════════════════════════════

function renderDashboard() {
  const clients = DB.clients;
  document.getElementById('dash-today').textContent = fmtDate(today());

  // Stats
  const foods = DB.foods.filter(f => f.date === today());
  const workouts = DB.workouts.filter(w => w.date === today());
  const totalCal = foods.reduce((s,f)=>s+(+f.cal||0),0);
  document.getElementById('dash-stats').innerHTML = `
    <div class="stat-box"><div class="stat-val">${clients.length}</div><div class="stat-lbl">Clients</div></div>
    <div class="stat-box"><div class="stat-val">${totalCal}</div><div class="stat-lbl">Cal Today</div></div>
    <div class="stat-box"><div class="stat-val">${workouts.length}</div><div class="stat-lbl">Workouts Today</div></div>
    <div class="stat-box"><div class="stat-val">${DB.foods.filter(f=>f.date===today()).reduce((s,f)=>s+(+f.protein||0),0)}g</div><div class="stat-lbl">Protein Today</div></div>
  `;

  // Nutrition summary
  const client = clients[0];
  const calGoal = client?.calGoal || 2000;
  const pct = Math.min(100, Math.round(totalCal/calGoal*100));
  const barClass = pct>100?'over':pct>85?'warn':'';
  document.getElementById('dash-nutrition').innerHTML = client ? `
    <div style="margin-bottom:10px;font-size:0.85rem;color:var(--text-dim);">${client.name} — ${totalCal} / ${calGoal} kcal</div>
    <div class="progress-wrap"><div class="progress-bar ${barClass}" style="width:${pct}%"></div></div>
    <div style="margin-top:14px;">
      ${foods.length ? foods.slice(-5).map(f=>`
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:0.85rem;">
          <span>${f.food}</span><span style="color:var(--green)">${f.cal} kcal</span>
        </div>`).join('') : '<div class="empty" style="padding:20px">No food logged today</div>'}
    </div>
  ` : '<div class="empty">No clients added yet</div>';

  // Workout summary
  document.getElementById('dash-workout').innerHTML = workouts.length ? workouts.map(w=>`
    <div style="padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="font-weight:600;">${w.name}</div>
      <div style="font-size:0.82rem;color:var(--text-dim);margin-top:3px;">${w.type} · ${w.duration||0} min · ${w.exercises?.length||0} exercises</div>
    </div>
  `).join('') : '<div class="empty" style="padding:20px">No workouts logged today</div>';

  // Client overview
  document.getElementById('dash-clients').innerHTML = clients.length ? `
    <table>
      <thead><tr><th>Name</th><th>Goal</th><th>Current Weight</th><th>Goal Weight</th><th>Progress</th></tr></thead>
      <tbody>${clients.map(c=>{
        const diff = c.startWeight && c.weight ? (c.weight - c.startWeight).toFixed(1) : null;
        const diffHtml = diff!==null ? `<span class="${diff<0?'trend-down':'trend-up'}">${diff>0?'+':''}${diff} lbs</span>` : '<span class="trend-flat">—</span>';
        return `<tr>
          <td><strong>${c.name}</strong><br><small style="color:var(--text-dim)">${c.relationship}</small></td>
          <td><span class="badge badge-blue">${c.goal}</span></td>
          <td>${c.weight ? c.weight+' lbs' : '—'}</td>
          <td>${c.goalWeight ? c.goalWeight+' lbs' : '—'}</td>
          <td>${diffHtml}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>
  ` : '<div class="empty">No clients yet. Go to Clients tab to add one.</div>';
}

// ═══════════════════════════ NUTRITION ════════════════════════════

function renderNutrition() {
  populateClientSelects();
  const clientId = getActiveNutritionClient();
  const client = DB.clients.find(c=>c.id===clientId);
  const d = state.nutritionDate;
  document.getElementById('nutrition-date-display').textContent = `${dateLabel(d)} (${fmtDate(d)})`;
  document.getElementById('nutrition-client-select').onchange = renderNutrition;

  const foods = DB.foods.filter(f=>f.clientId===clientId && f.date===d);
  const totals = {cal:0,protein:0,carbs:0,fat:0};
  foods.forEach(f=>{
    totals.cal += +f.cal||0;
    totals.protein += +f.protein||0;
    totals.carbs += +f.carbs||0;
    totals.fat += +f.fat||0;
  });

  const calGoal = client?.calGoal||2000;
  const proteinGoal = client?.proteinGoal||140;
  const pct = Math.min(100,Math.round(totals.cal/calGoal*100));
  const proteinPct = Math.min(100,Math.round(totals.protein/proteinGoal*100));
  const barClass = pct>100?'over':pct>85?'warn':'';

  document.getElementById('nutrition-summary').innerHTML = `
    <div class="card-title">📊 ${client?.name||'Select Client'} — ${fmtDate(d)}</div>
    <div class="macro-row">
      <div class="macro-pill cal"><div class="macro-val">${totals.cal}</div><div class="macro-lbl">Calories</div></div>
      <div class="macro-pill protein"><div class="macro-val">${totals.protein}g</div><div class="macro-lbl">Protein</div></div>
      <div class="macro-pill carbs"><div class="macro-val">${totals.carbs}g</div><div class="macro-lbl">Carbs</div></div>
      <div class="macro-pill fat"><div class="macro-val">${totals.fat}g</div><div class="macro-lbl">Fat</div></div>
    </div>
    <div style="margin-top:16px;">
      <div style="display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:6px;">
        <span>Calories</span><span style="color:var(--text-dim)">${totals.cal} / ${calGoal} kcal (${pct}%)</span>
      </div>
      <div class="progress-wrap"><div class="progress-bar ${barClass}" style="width:${pct}%"></div></div>
    </div>
    <div style="margin-top:10px;">
      <div style="display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:6px;">
        <span>Protein</span><span style="color:var(--text-dim)">${totals.protein}g / ${proteinGoal}g (${proteinPct}%)</span>
      </div>
      <div class="progress-wrap"><div class="progress-bar" style="width:${proteinPct}%;background:#ff6b6b;box-shadow:0 0 6px rgba(255,107,107,0.4)"></div></div>
    </div>
    <div style="margin-top:12px;font-size:0.8rem;color:var(--text-dim);">
      Remaining: <strong style="color:var(--green)">${Math.max(0,calGoal-totals.cal)} kcal</strong>
      ${totals.cal>calGoal?`<span class="badge badge-red" style="margin-left:8px;">Over by ${totals.cal-calGoal} kcal</span>`:''}
    </div>
  `;

  // Group by meal
  const meals = ['Breakfast','Lunch','Dinner','Snack'];
  const byMeal = {};
  meals.forEach(m=>byMeal[m]=[]);
  foods.forEach(f=>{ if(byMeal[f.meal]) byMeal[f.meal].push(f); else byMeal['Snack'].push(f); });

  document.getElementById('food-log-body').innerHTML = meals.map(meal=>{
    const items = byMeal[meal];
    const mealCal = items.reduce((s,f)=>s+(+f.cal||0),0);
    return `
      <div style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
          <strong style="color:var(--text)">${meal}</strong>
          <span style="font-size:0.82rem;color:var(--green)">${mealCal} kcal</span>
        </div>
        ${items.length ? items.map(f=>`
          <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1a1a1a;font-size:0.87rem;">
            <div style="flex:1;">
              <div>${f.food}</div>
              ${f.serving?`<div style="font-size:0.75rem;color:var(--text-dim)">${f.serving}</div>`:''}
            </div>
            <div style="text-align:right;min-width:150px;color:var(--text-dim);font-size:0.8rem;">
              P:${f.protein||0}g C:${f.carbs||0}g F:${f.fat||0}g
            </div>
            <div style="min-width:70px;text-align:right;font-weight:600;color:var(--green)">${f.cal} kcal</div>
            <button class="btn btn-red btn-sm" onclick="deleteFood('${f.id}')">✕</button>
          </div>
        `).join('') : '<div style="color:var(--text-dim);font-size:0.82rem;padding:8px 0;">Nothing logged</div>'}
      </div>
    `;
  }).join('');
}

function openAddFoodModal() {
  ['food-name','food-serving'].forEach(id=>document.getElementById(id).value='');
  ['food-cal','food-protein','food-carbs','food-fat'].forEach(id=>document.getElementById(id).value='');
  openModal('modal-food');
}

function saveFood() {
  const food = document.getElementById('food-name').value.trim();
  if (!food) { showToast('Enter a food name'); return; }
  const clientId = getActiveNutritionClient();
  const entry = {
    id: uid(),
    clientId,
    date: state.nutritionDate,
    food,
    meal: document.getElementById('food-meal').value,
    cal: document.getElementById('food-cal').value||0,
    protein: document.getElementById('food-protein').value||0,
    carbs: document.getElementById('food-carbs').value||0,
    fat: document.getElementById('food-fat').value||0,
    serving: document.getElementById('food-serving').value,
  };
  DB.foods = [...DB.foods, entry];
  closeModal('modal-food');
  renderNutrition();
  showToast('Food logged!');
}

function deleteFood(id) {
  DB.foods = DB.foods.filter(f=>f.id!==id);
  renderNutrition();
}

// ═══════════════════════════ WORKOUTS ═════════════════════════════

let exerciseRows = [];

function renderWorkouts() {
  populateClientSelects();
  const clientId = getActiveWorkoutClient();
  const d = state.workoutDate;
  document.getElementById('workout-date-display').textContent = `${dateLabel(d)} (${fmtDate(d)})`;
  document.getElementById('workout-client-select').onchange = renderWorkouts;

  const workouts = DB.workouts.filter(w=>w.clientId===clientId && w.date===d);

  document.getElementById('workout-log-body').innerHTML = workouts.length ? workouts.map(w=>`
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
        <div>
          <div style="font-size:1.05rem;font-weight:700;">${w.name}</div>
          <div style="font-size:0.82rem;color:var(--text-dim);margin-top:2px;">
            <span class="badge badge-blue">${w.type}</span>
            ${w.duration?`<span style="margin-left:8px;">⏱ ${w.duration} min</span>`:''}
            ${w.calories?`<span style="margin-left:8px;">🔥 ${w.calories} kcal</span>`:''}
          </div>
        </div>
        <button class="btn btn-red btn-sm" onclick="deleteWorkout('${w.id}')">Delete</button>
      </div>
      ${w.exercises?.length ? `
        <table style="margin-bottom:10px;">
          <thead><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th>Weight</th><th>Notes</th></tr></thead>
          <tbody>${w.exercises.map(e=>`<tr>
            <td>${e.name}</td>
            <td>${e.sets||'—'}</td>
            <td>${e.reps||'—'}</td>
            <td>${e.weight?e.weight+' lbs':'—'}</td>
            <td style="color:var(--text-dim)">${e.notes||''}</td>
          </tr>`).join('')}</tbody>
        </table>
      ` : ''}
      ${w.notes?`<div style="font-size:0.85rem;color:var(--text-dim);border-top:1px solid var(--border);padding-top:10px;margin-top:4px;">${w.notes}</div>`:''}
    </div>
  `).join('') : `<div class="card empty">No workouts logged for ${dateLabel(d)}. Click "+ Log Workout" to add one.</div>`;

  renderPRBoard(clientId);
}

function renderPRBoard(clientId) {
  const workouts = DB.workouts.filter(w=>w.clientId===clientId);
  const prs = {};
  workouts.forEach(w=>{
    w.exercises?.forEach(e=>{
      if (!e.name || !e.weight) return;
      const key = e.name.toLowerCase();
      const wt = +e.weight;
      if (!prs[key] || wt > prs[key].weight) {
        prs[key] = { name: e.name, weight: wt, date: w.date };
      }
    });
  });
  const keys = Object.keys(prs);
  document.getElementById('pr-board').innerHTML = keys.length ? `
    <table>
      <thead><tr><th>Exercise</th><th>Best Weight</th><th>Date</th></tr></thead>
      <tbody>${keys.sort().map(k=>`<tr>
        <td>${prs[k].name}</td>
        <td><strong style="color:var(--green)">${prs[k].weight} lbs</strong></td>
        <td style="color:var(--text-dim)">${fmtDate(prs[k].date)}</td>
      </tr>`).join('')}</tbody>
    </table>
  ` : '<div class="empty">Log workouts with weights to track personal records.</div>';
}

function openAddWorkoutModal() {
  document.getElementById('wo-name').value='';
  document.getElementById('wo-duration').value='';
  document.getElementById('wo-calories').value='';
  document.getElementById('wo-notes').value='';
  exerciseRows = [];
  document.getElementById('exercise-list').innerHTML='';
  addExerciseRow();
  openModal('modal-workout');
}

function addExerciseRow() {
  const id = uid();
  exerciseRows.push(id);
  const div = document.createElement('div');
  div.id = 'exrow-'+id;
  div.style.cssText = 'display:grid;grid-template-columns:2fr 1fr 1fr 1fr 2fr auto;gap:8px;margin-bottom:8px;align-items:end;';
  div.innerHTML = `
    <div><label style="font-size:0.75rem">Exercise</label><input class="ex-name" placeholder="Bench Press" /></div>
    <div><label style="font-size:0.75rem">Sets</label><input class="ex-sets" type="number" placeholder="3" /></div>
    <div><label style="font-size:0.75rem">Reps</label><input class="ex-reps" placeholder="8-10" /></div>
    <div><label style="font-size:0.75rem">Weight (lbs)</label><input class="ex-weight" type="number" placeholder="135" /></div>
    <div><label style="font-size:0.75rem">Notes</label><input class="ex-notes" placeholder="RPE 8" /></div>
    <div><button class="btn btn-red btn-sm" onclick="removeExRow('${id}')" style="margin-top:18px">✕</button></div>
  `;
  document.getElementById('exercise-list').appendChild(div);
}

function removeExRow(id) {
  document.getElementById('exrow-'+id)?.remove();
  exerciseRows = exerciseRows.filter(r=>r!==id);
}

function saveWorkout() {
  const name = document.getElementById('wo-name').value.trim();
  if (!name) { showToast('Enter a workout name'); return; }
  const clientId = getActiveWorkoutClient();
  const exercises = [...document.querySelectorAll('#exercise-list > div')].map(row=>({
    name: row.querySelector('.ex-name')?.value||'',
    sets: row.querySelector('.ex-sets')?.value||'',
    reps: row.querySelector('.ex-reps')?.value||'',
    weight: row.querySelector('.ex-weight')?.value||'',
    notes: row.querySelector('.ex-notes')?.value||'',
  })).filter(e=>e.name);

  const entry = {
    id: uid(),
    clientId,
    date: state.workoutDate,
    name,
    type: document.getElementById('wo-type').value,
    duration: document.getElementById('wo-duration').value||0,
    calories: document.getElementById('wo-calories').value||0,
    exercises,
    notes: document.getElementById('wo-notes').value,
  };
  DB.workouts = [...DB.workouts, entry];
  closeModal('modal-workout');
  renderWorkouts();
  showToast('Workout logged!');
}

function deleteWorkout(id) {
  DB.workouts = DB.workouts.filter(w=>w.id!==id);
  renderWorkouts();
}

// ═══════════════════════════ CLIENTS ══════════════════════════════

let selectedClientId = null;

function renderClients() {
  const clients = DB.clients;
  const grid = document.getElementById('client-grid');
  if (!clients.length) {
    grid.innerHTML = `<div class="card empty" style="grid-column:1/-1;">No clients yet. Click "+ Add Client" to get started.</div>`;
    document.getElementById('client-detail').style.display='none';
    return;
  }
  grid.innerHTML = clients.map(c=>{
    const diff = c.startWeight && c.weight ? (c.weight - c.startWeight).toFixed(1) : null;
    const diffHtml = diff!==null ? `<span class="${diff<0?'trend-down':diff>0?'trend-up':'trend-flat'}">${diff>0?'+':''}${diff} lbs</span>` : '';
    return `
      <div class="client-card ${c.id===selectedClientId?'selected':''}" onclick="selectClient('${c.id}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div class="client-name">${c.name}</div>
            <div class="client-meta">${c.relationship} · ${c.goal}</div>
          </div>
          <span class="badge badge-green">${c.relationship}</span>
        </div>
        <div style="margin-top:12px;display:flex;gap:12px;flex-wrap:wrap;">
          ${c.weight?`<div style="font-size:0.82rem;"><span style="color:var(--text-dim)">Weight</span><br><strong>${c.weight} lbs</strong> ${diffHtml}</div>`:''}
          ${c.goalWeight?`<div style="font-size:0.82rem;"><span style="color:var(--text-dim)">Goal</span><br><strong>${c.goalWeight} lbs</strong></div>`:''}
          ${c.calGoal?`<div style="font-size:0.82rem;"><span style="color:var(--text-dim)">Cal Goal</span><br><strong>${c.calGoal}</strong></div>`:''}
        </div>
      </div>
    `;
  }).join('');

  if (selectedClientId) renderClientDetail(selectedClientId);
}

function selectClient(id) {
  selectedClientId = id;
  renderClients();
  document.getElementById('client-detail').style.display='block';
  document.getElementById('client-detail').scrollIntoView({behavior:'smooth',block:'start'});
}

function renderClientDetail(id) {
  const c = DB.clients.find(x=>x.id===id);
  if (!c) return;
  const progress = DB.progress.filter(p=>p.clientId===id).sort((a,b)=>a.date.localeCompare(b.date));
  const foods = DB.foods.filter(f=>f.clientId===id);
  const workouts = DB.workouts.filter(w=>w.clientId===id);
  const diff = c.startWeight && c.weight ? (c.weight - c.startWeight).toFixed(1) : null;
  const toGoal = c.goalWeight && c.weight ? (c.weight - c.goalWeight).toFixed(1) : null;

  document.getElementById('client-detail').innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
        <div>
          <div style="font-size:1.4rem;font-weight:700;color:var(--green)">${c.name}</div>
          <div style="color:var(--text-dim);margin-top:2px;">${c.relationship} · ${c.goal}</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-sm btn-outline" onclick="openClientModal('${c.id}')">Edit Client</button>
          <button class="btn btn-sm btn-orange" onclick="openProgressModal('${c.id}')">+ Progress Update</button>
          <button class="btn btn-sm btn-blue" onclick="openWeightModal('${c.id}')">Update Weight</button>
          <button class="btn btn-sm btn-red" onclick="deleteClient('${c.id}')">Delete</button>
        </div>
      </div>

      <div class="grid-4" style="margin-bottom:20px;">
        <div class="stat-box"><div class="stat-val">${c.weight||'—'}</div><div class="stat-lbl">Current Weight (lbs)</div></div>
        <div class="stat-box"><div class="stat-val" style="${diff<0?'color:var(--green)':diff>0?'color:var(--orange)':''}">${diff!==null?(diff>0?'+':'')+diff:'—'}</div><div class="stat-lbl">Weight Change (lbs)</div></div>
        <div class="stat-box"><div class="stat-val">${toGoal!==null?Math.abs(toGoal):'—'}</div><div class="stat-lbl">Lbs to Goal</div></div>
        <div class="stat-box"><div class="stat-val">${workouts.length}</div><div class="stat-lbl">Total Workouts</div></div>
      </div>

      <div class="grid-2">
        <div>
          <div class="card-title" style="margin-bottom:12px;">Client Info</div>
          <table>
            <tbody>
              ${c.age?`<tr><td style="color:var(--text-dim)">Age</td><td>${c.age}</td></tr>`:''}
              ${c.height?`<tr><td style="color:var(--text-dim)">Height</td><td>${c.height}</td></tr>`:''}
              ${c.startWeight?`<tr><td style="color:var(--text-dim)">Starting Weight</td><td>${c.startWeight} lbs</td></tr>`:''}
              ${c.weight?`<tr><td style="color:var(--text-dim)">Current Weight</td><td>${c.weight} lbs</td></tr>`:''}
              ${c.goalWeight?`<tr><td style="color:var(--text-dim)">Goal Weight</td><td>${c.goalWeight} lbs</td></tr>`:''}
              ${c.calGoal?`<tr><td style="color:var(--text-dim)">Calorie Goal</td><td>${c.calGoal} kcal/day</td></tr>`:''}
              ${c.proteinGoal?`<tr><td style="color:var(--text-dim)">Protein Goal</td><td>${c.proteinGoal}g/day</td></tr>`:''}
              <tr><td style="color:var(--text-dim)">Primary Goal</td><td><span class="badge badge-blue">${c.goal}</span></td></tr>
              ${c.notes?`<tr><td style="color:var(--text-dim);vertical-align:top">Notes</td><td>${c.notes}</td></tr>`:''}
            </tbody>
          </table>
        </div>

        <div>
          <div class="card-title" style="margin-bottom:12px;">Recent Stats</div>
          <div style="font-size:0.85rem;color:var(--text-dim);margin-bottom:8px;">Last 7 days</div>
          ${renderClientStats(id)}
        </div>
      </div>

      <div style="margin-top:20px;">
        <div class="card-title" style="margin-bottom:12px;">Progress Updates</div>
        ${progress.length ? [...progress].reverse().map(p=>`
          <div class="progress-note">
            <div class="note-date">${fmtDate(p.date)}${p.weight?` · Weight: <strong>${p.weight} lbs</strong>`:''}</div>
            <div class="note-text">${p.note}</div>
            <button class="btn btn-red btn-sm" style="margin-top:6px;" onclick="deleteProgress('${p.id}','${id}')">Remove</button>
          </div>
        `).join('') : '<div class="empty" style="padding:20px 0;">No progress updates yet.</div>'}
      </div>

      <div style="margin-top:20px;">
        <div class="card-title" style="margin-bottom:12px;">Workout History</div>
        ${workouts.length ? `
          <table>
            <thead><tr><th>Date</th><th>Workout</th><th>Type</th><th>Duration</th><th>Exercises</th></tr></thead>
            <tbody>${[...workouts].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(w=>`<tr>
              <td>${fmtDate(w.date)}</td>
              <td>${w.name}</td>
              <td><span class="badge badge-blue">${w.type}</span></td>
              <td>${w.duration?w.duration+' min':'—'}</td>
              <td>${w.exercises?.length||0}</td>
            </tr>`).join('')}</tbody>
          </table>
        ` : '<div class="empty" style="padding:20px 0;">No workouts logged yet.</div>'}
      </div>
    </div>
  `;
}

function renderClientStats(clientId) {
  const sevenDaysAgo = new Date(); sevenDaysAgo.setDate(sevenDaysAgo.getDate()-7);
  const cutoff = sevenDaysAgo.toISOString().slice(0,10);
  const foods = DB.foods.filter(f=>f.clientId===clientId && f.date>=cutoff);
  const workouts = DB.workouts.filter(w=>w.clientId===clientId && w.date>=cutoff);
  const totalCal = foods.reduce((s,f)=>s+(+f.cal||0),0);
  const totalProtein = foods.reduce((s,f)=>s+(+f.protein||0),0);
  const days = [...new Set(foods.map(f=>f.date))].length;
  return `
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div class="stat-box" style="text-align:left;padding:12px;">
        <div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:2px;">DAYS LOGGED</div>
        <div style="font-weight:700;color:var(--green)">${days} / 7 days</div>
      </div>
      <div class="stat-box" style="text-align:left;padding:12px;">
        <div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:2px;">AVG DAILY CALORIES</div>
        <div style="font-weight:700;color:var(--green)">${days?Math.round(totalCal/days):0} kcal</div>
      </div>
      <div class="stat-box" style="text-align:left;padding:12px;">
        <div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:2px;">TOTAL PROTEIN</div>
        <div style="font-weight:700;color:#ff6b6b">${totalProtein}g</div>
      </div>
      <div class="stat-box" style="text-align:left;padding:12px;">
        <div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:2px;">WORKOUTS</div>
        <div style="font-weight:700;color:var(--blue)">${workouts.length}</div>
      </div>
    </div>
  `;
}

function openClientModal(editId) {
  document.getElementById('cl-edit-id').value = editId||'';
  document.getElementById('client-modal-title').textContent = editId ? 'Edit Client' : 'Add Client';
  const fields = ['cl-name','cl-age','cl-height','cl-start-weight','cl-weight','cl-goal-weight','cl-cal-goal','cl-protein-goal','cl-notes'];
  fields.forEach(id=>document.getElementById(id).value='');

  if (editId) {
    const c = DB.clients.find(x=>x.id===editId);
    if (c) {
      document.getElementById('cl-name').value = c.name||'';
      document.getElementById('cl-age').value = c.age||'';
      document.getElementById('cl-height').value = c.height||'';
      document.getElementById('cl-start-weight').value = c.startWeight||'';
      document.getElementById('cl-weight').value = c.weight||'';
      document.getElementById('cl-goal-weight').value = c.goalWeight||'';
      document.getElementById('cl-cal-goal').value = c.calGoal||'';
      document.getElementById('cl-protein-goal').value = c.proteinGoal||'';
      document.getElementById('cl-notes').value = c.notes||'';
      document.getElementById('cl-relationship').value = c.relationship||'Client';
      document.getElementById('cl-goal').value = c.goal||'Weight Loss';
    }
  }
  openModal('modal-client');
}

function saveClient() {
  const name = document.getElementById('cl-name').value.trim();
  if (!name) { showToast('Enter a client name'); return; }
  const editId = document.getElementById('cl-edit-id').value;
  const data = {
    name,
    relationship: document.getElementById('cl-relationship').value,
    age: document.getElementById('cl-age').value,
    height: document.getElementById('cl-height').value,
    startWeight: document.getElementById('cl-start-weight').value,
    weight: document.getElementById('cl-weight').value,
    goalWeight: document.getElementById('cl-goal-weight').value,
    calGoal: document.getElementById('cl-cal-goal').value||2000,
    proteinGoal: document.getElementById('cl-protein-goal').value||140,
    goal: document.getElementById('cl-goal').value,
    notes: document.getElementById('cl-notes').value,
  };
  if (editId) {
    DB.clients = DB.clients.map(c=>c.id===editId?{...c,...data}:c);
  } else {
    data.id = uid();
    data.createdAt = today();
    DB.clients = [...DB.clients, data];
  }
  closeModal('modal-client');
  renderClients();
  populateClientSelects();
  showToast(editId ? 'Client updated!' : 'Client added!');
}

function deleteClient(id) {
  if (!confirm('Delete this client and all their data? This cannot be undone.')) return;
  DB.clients = DB.clients.filter(c=>c.id!==id);
  DB.foods = DB.foods.filter(f=>f.clientId!==id);
  DB.workouts = DB.workouts.filter(w=>w.clientId!==id);
  DB.progress = DB.progress.filter(p=>p.clientId!==id);
  selectedClientId = null;
  document.getElementById('client-detail').style.display='none';
  renderClients();
  populateClientSelects();
  showToast('Client deleted.');
}

function openProgressModal(clientId) {
  document.getElementById('prog-client-id').value = clientId;
  document.getElementById('prog-weight').value = '';
  document.getElementById('prog-note').value = '';
  document.getElementById('prog-date').value = today();
  openModal('modal-progress');
}

function saveProgress() {
  const clientId = document.getElementById('prog-client-id').value;
  const note = document.getElementById('prog-note').value.trim();
  if (!note) { showToast('Enter a progress note'); return; }
  const entry = {
    id: uid(),
    clientId,
    date: document.getElementById('prog-date').value || today(),
    weight: document.getElementById('prog-weight').value,
    note,
  };
  DB.progress = [...DB.progress, entry];
  if (entry.weight) {
    DB.clients = DB.clients.map(c=>c.id===clientId?{...c,weight:entry.weight}:c);
  }
  closeModal('modal-progress');
  renderClientDetail(clientId);
  showToast('Progress update saved!');
}

function deleteProgress(id, clientId) {
  DB.progress = DB.progress.filter(p=>p.id!==id);
  renderClientDetail(clientId);
}

function openWeightModal(clientId) {
  document.getElementById('weight-client-id').value = clientId;
  const c = DB.clients.find(x=>x.id===clientId);
  document.getElementById('new-weight').value = c?.weight||'';
  openModal('modal-weight');
}

function saveWeight() {
  const clientId = document.getElementById('weight-client-id').value;
  const weight = document.getElementById('new-weight').value;
  if (!weight) { showToast('Enter a weight'); return; }
  DB.clients = DB.clients.map(c=>c.id===clientId?{...c,weight}:c);
  closeModal('modal-weight');
  renderClients();
  renderClientDetail(clientId);
  showToast('Weight updated!');
}

// ═══════════════════════════ INIT ═════════════════════════════════

ensureDefaultClient();
populateClientSelects();
renderDashboard();
</script>
</body>
</html>
